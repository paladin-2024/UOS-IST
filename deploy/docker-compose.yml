# Shared-VPS layout: this box already runs its own nginx (host-level,
# serving other unrelated projects) and its own Postgres for other projects,
# so this stack does NOT run nginx or expose Postgres to the host at all --
# only two PHP-FPM containers, reachable from the *existing* host nginx via
# 127.0.0.1:9101 / 127.0.0.1:9102, plus a Postgres container fully isolated
# on the internal compose network (no host port published, so it can't
# collide with the other Postgres already running here).
#
# Assumes this repo is checked out at /opt/ucg-butembo on the host (adjust
# every "/opt/ucg-butembo" below AND in ../nginx-host/*.conf together if you
# used a different path).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-istm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-istm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  gestion:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../Projet_E-Gestion/.env
    volumes:
      # Bind-mounted at the SAME absolute path the host uses, so nginx's
      # $document_root (host-side path) and php-fpm's own filesystem view
      # (container-side) resolve to the identical string -- no path
      # translation needed in the fastcgi_param SCRIPT_FILENAME line.
      - /opt/ucg-butembo/Projet_E-Gestion:/opt/ucg-butembo/Projet_E-Gestion
    ports:
      - "127.0.0.1:9101:9000"
    depends_on:
      postgres:
        condition: service_healthy

  portail:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../projet_website/.env
    volumes:
      - /opt/ucg-butembo/projet_website:/opt/ucg-butembo/projet_website
    ports:
      - "127.0.0.1:9102:9000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
