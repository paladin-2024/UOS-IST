# std.ucg-butembo.net -- Espace Étudiants (dossiers module, same
# codebase/container/database as the gestion app, served from its own docroot).
#
# Plain HTTP vhost -- run `certbot --nginx -d ucg-butembo.net -d
# std.ucg-butembo.net -d portail.ucg-butembo.net` once to get a single SAN
# cert covering all three hosts; certbot will add the HTTPS server block and
# the http->https redirect to each of these three files automatically.
server {
    listen 80;
    server_name std.ucg-butembo.net;
    root /opt/ucg-butembo/Projet_E-Gestion/dossiers;
    index index.php;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ /\. { deny all; }
    location ~ \.(env|sql|md|htaccess|config)$ { deny all; }
    location ^~ /uploads/ {
        location ~ \.php$ { deny all; }
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Same gestion container as ucg-butembo.net (127.0.0.1:9101)
        fastcgi_pass 127.0.0.1:9101;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
