# std-ucg-butembo.wscsarl.info -- Espace Étudiants (dossiers module, same
# codebase/container/database as the gestion app, served from its own docroot).
#
# HTTPS blocks below were added by `certbot --nginx` -- don't hand-edit those.
server {
    server_name std-ucg-butembo.wscsarl.info;
    root /opt/ucg-butembo/Projet_E-Gestion/dossiers;
    index index.php;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ /\. { deny all; }
    location ~ \.(env|sql|md|htaccess|config)$ { deny all; }
    location ^~ /uploads/ {
        location ~ \.php$ { deny all; }
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Same gestion container as ucg-butembo.wscsarl.info (127.0.0.1:9101)
        fastcgi_pass 127.0.0.1:9101;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ucg-butembo.wscsarl.info/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ucg-butembo.wscsarl.info/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = std-ucg-butembo.wscsarl.info) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name std-ucg-butembo.wscsarl.info;
    return 404; # managed by Certbot


}
