# ucg-butembo.wscsarl.info -- Système de Gestion (E-Gestion admin)
# Drop into /etc/nginx/conf.d/ on the HOST (this box's existing nginx, not a
# container) -- proxies PHP execution to the gestion php-fpm container on
# 127.0.0.1:9101.
server {
    listen 80;
    server_name ucg-butembo.wscsarl.info;
    root /opt/ucg-butembo/Projet_E-Gestion;
    index index.php;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ /\. { deny all; }
    location ~ \.(env|sql|md|htaccess|config)$ { deny all; }

    # controller/ and api_controller/ are real files, served directly (not rewritten)
    location ^~ /controller/ { try_files $uri =404; }
    location ^~ /api_controller/ { try_files $uri =404; }

    location / {
        try_files $uri $uri/ @rewrite;
    }

    location @rewrite {
        rewrite ^/(.*)$ /index.php?view=$1&$args last;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9101;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
