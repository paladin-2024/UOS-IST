# ucg-butembo.wscsarl.info -- Système de Gestion (E-Gestion admin)
# Drop into /etc/nginx/conf.d/ on the HOST (this box's existing nginx, not a
# container) -- proxies PHP execution to the gestion php-fpm container on
# 127.0.0.1:9101.
#
# HTTPS blocks below were added by `certbot --nginx` (real output pulled from
# the VPS after running it) -- don't hand-edit those, they're certbot's.
server {
    server_name ucg-butembo.wscsarl.info;
    root /opt/ucg-butembo/Projet_E-Gestion;
    index index.php;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ /\. { deny all; }
    location ~ \.(env|sql|md|htaccess|config)$ { deny all; }

    # controller/ and api_controller/ hold real files (matches the old
    # .htaccess "don't rewrite these" rule) -- no special location block
    # needed: try_files below already serves an existing file as-is (no
    # rewrite to index.php?view=...), and it correctly falls through to the
    # \.php$ handler for execution. A `location ^~ /controller/ { try_files
    # $uri =404; }` block here was tried first and was wrong -- its `^~`
    # prefix match takes priority over the \.php$ regex location, so it
    # intercepted requests and served .php files as static content instead
    # of executing them; static serving doesn't allow POST, so every login
    # POST 405'd. Caught live: "405 Not Allowed" on the real admin login.

    location / {
        try_files $uri $uri/ @rewrite;
    }

    location @rewrite {
        rewrite ^/(.*)$ /index.php?view=$1&$args last;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9101;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ucg-butembo.wscsarl.info/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ucg-butembo.wscsarl.info/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = ucg-butembo.wscsarl.info) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name ucg-butembo.wscsarl.info;
    return 404; # managed by Certbot


}
