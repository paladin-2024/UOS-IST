# portail-ucg-butembo.wscsarl.info -- public website (projet_website)
#
# HTTPS blocks below were added by `certbot --nginx` -- don't hand-edit those.
server {
    server_name portail-ucg-butembo.wscsarl.info;
    root /opt/ucg-butembo/projet_website;
    index index.php;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location ~ /\. { deny all; }
    location ~ \.(env|sql|md|htaccess|config)$ { deny all; }
    location ^~ /uploads/ {
        location ~ \.php$ { deny all; }
    }

    # controller/ holds real files -- no special location block needed here,
    # see the long comment in nginx-host/gestion.conf for why (a `^~
    # /controller/` block with only try_files intercepts requests before the
    # \.php$ handler and 405's every POST since static serving disallows it).

    location / {
        try_files $uri $uri/ @rewrite;
    }

    location @rewrite {
        rewrite ^/(.*)$ /index.php?view=$1&$args last;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9102;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ucg-butembo.wscsarl.info/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ucg-butembo.wscsarl.info/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = portail-ucg-butembo.wscsarl.info) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name portail-ucg-butembo.wscsarl.info;
    return 404; # managed by Certbot


}
