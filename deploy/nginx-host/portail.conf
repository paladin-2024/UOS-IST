# portail.ucg-butembo.net -- public website (projet_website)
#
# Plain HTTP vhost -- run `certbot --nginx -d ucg-butembo.net -d
# std.ucg-butembo.net -d portail.ucg-butembo.net` once to get a single SAN
# cert covering all three hosts; certbot will add the HTTPS server block and
# the http->https redirect to each of these three files automatically.
server {
    listen 80;
    server_name portail.ucg-butembo.net;
    root /opt/ucg-butembo/projet_website;
    index index.php;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location ~ /\. { deny all; }
    location ~ \.(env|sql|md|htaccess|config)$ { deny all; }
    location ^~ /uploads/ {
        location ~ \.php$ { deny all; }
    }

    # controller/ holds real files -- no special location block needed here,
    # see the long comment in nginx-host/gestion.conf for why (a `^~
    # /controller/` block with only try_files intercepts requests before the
    # \.php$ handler and 405's every POST since static serving disallows it).

    location / {
        try_files $uri $uri/ @rewrite;
    }

    location @rewrite {
        rewrite ^/(.*)$ /index.php?view=$1&$args last;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9102;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
