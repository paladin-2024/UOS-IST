# std-ucg-butembo.wscsarl.info -- Espace Étudiants (dossiers module, same
# codebase/database as the gestion app, served from its own docroot).
server {
    listen 80;
    server_name std-ucg-butembo.wscsarl.info;
    root /var/www/gestion/dossiers;
    index index.php;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ /\. { deny all; }
    location ~ \.(env|sql|md|git|htaccess|config)$ { deny all; }
    location ^~ /uploads/ {
        location ~ \.php$ { deny all; }
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass gestion:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        # Same gestion container as ucg-butembo.wscsarl.info, but the "dossiers"
        # subdirectory is this vhost's docroot -- path must match the
        # container's internal layout (/var/www/html/dossiers), not nginx's own.
        fastcgi_param SCRIPT_FILENAME /var/www/html/dossiers$fastcgi_script_name;
    }
}
