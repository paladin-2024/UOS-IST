# portail-ucg-butembo.wscsarl.info -- public website (projet_website)
server {
    listen 80;
    server_name portail-ucg-butembo.wscsarl.info;
    root /var/www/portail;
    index index.php;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location ~ /\. { deny all; }
    location ~ \.(env|sql|md|git|htaccess|config)$ { deny all; }
    location ^~ /uploads/ {
        location ~ \.php$ { deny all; }
    }

    location ^~ /controller/ { try_files $uri =404; }

    location / {
        try_files $uri $uri/ @rewrite;
    }

    location @rewrite {
        rewrite ^/(.*)$ /index.php?view=$1&$args last;
    }

    location ~ \.php$ {
        fastcgi_pass portail:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
    }
}
