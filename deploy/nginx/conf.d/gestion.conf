# ucg-butembo.wscsarl.info -- Système de Gestion (E-Gestion admin)
server {
    listen 80;
    server_name ucg-butembo.wscsarl.info;
    root /var/www/gestion;
    index index.php;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ /\. { deny all; }
    location ~ \.(env|sql|md|git|htaccess|config)$ { deny all; }

    # controller/ and api_controller/ are real files, served directly (not rewritten)
    location ^~ /controller/ { try_files $uri =404; }
    location ^~ /api_controller/ { try_files $uri =404; }

    location / {
        try_files $uri $uri/ @rewrite;
    }

    location @rewrite {
        rewrite ^/(.*)$ /index.php?view=$1&$args last;
    }

    location ~ \.php$ {
        fastcgi_pass gestion:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        # Path as seen inside the gestion php-fpm container, NOT nginx's own
        # mount point above -- they're separate containers with separate
        # filesystems, so this must match the Dockerfile's WORKDIR/COPY target.
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
    }
}
