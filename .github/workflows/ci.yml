name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, gd, zip, mbstring, intl

      - name: Lint Projet_E-Gestion
        run: |
          find Projet_E-Gestion -name "*.php" -print0 \
            | xargs -0 -P "$(nproc)" -I{} php -l "{}" \
            | grep -v "No syntax errors detected" && exit 1 || true

      - name: Lint projet_website
        run: |
          find projet_website -name "*.php" -print0 \
            | xargs -0 -P "$(nproc)" -I{} php -l "{}" \
            | grep -v "No syntax errors detected" && exit 1 || true

  deploy-config-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          # .env files are gitignored (real secrets), so a fresh checkout has
          # none -- use the committed .env.example as CI-only placeholders,
          # same values a fresh clone would start from anyway.
          cp Projet_E-Gestion/.env.example Projet_E-Gestion/.env
          cp projet_website/.env.example projet_website/.env
          cd deploy
          POSTGRES_PASSWORD=ci-placeholder-only docker compose config -q

      - name: Validate nginx-host configs (syntax only)
        run: |
          set -e
          # Checked-in configs are the plain-HTTP, pre-certbot state (certbot
          # injects the HTTPS server blocks + cert paths live on the VPS), so
          # no fake cert files are needed here anymore.
          docker run --rm \
            -v "$PWD/deploy/nginx-host:/etc/nginx/conf.d:ro" \
            nginx:1.27-alpine nginx -t
